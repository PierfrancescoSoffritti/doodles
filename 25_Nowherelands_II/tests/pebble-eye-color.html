<pre id="result">Checking eyes remain neutral during a reply…</pre>
<script type="module">
import * as THREE from 'three';
import {PebbleEyeMeshes} from '../js/world/fauna/PebbleEyeMeshes.js?v=player-notes-8';
import {createFogUniforms} from '../js/world/FogGlsl.js';
const renderer=new THREE.WebGLRenderer(),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,20);
renderer.setSize(128,128);document.body.append(renderer.domElement);camera.position.z=4;

</script>
