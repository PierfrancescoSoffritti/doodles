<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowherelands · Motion studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b1c;color:#e6dfef;font:15px/1.6 system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:28px;left:32px;max-width:370px;z-index:2}h1{font-size:25px;font-weight:400;letter-spacing:.04em;margin:8px 0}p{color:#b8adc7;margin:10px 0}small{letter-spacing:.15em;color:#94849f;font-size:10px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select,a{font:inherit;color:inherit}button,select{border:1px solid #66547280;border-radius:8px;background:#191225;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#353043;border-color:#a6d5d6}a{color:#b0dbdf}footer{position:absolute;bottom:25px;left:32px;font-size:12px;color:#b8adc7}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls label{display:flex;gap:8px}#status{display:block;margin-top:14px;color:#abb5c5}#check{color:#849182;font-size:11px}@media(max-width:600px){header{left:20px;top:18px;max-width:330px}header p{font-size:13px}nav{margin:12px 0}footer{left:20px}}

<header><small>NOWHERELANDS · FAUNA</small><h1>Motion studies</h1><p>The body stays in place. Watch the light volume swell with movement, and deform in response to velocity and acceleration.</p>
<nav id="species"></nav><div class="controls"><button id="pause">Pause</button><button id="slow" aria-pressed="false">Slow motion</button><label><input type="checkbox" id="wire">Mesh</label></div>
<nav><label>View <select id="view"><option value="quarter">Three-quarter</option><option value="side">Side</option><option value="top">Top</option><option value="front">Front</option></select></label></nav>
<label id="pace-control">Lumen pace <select id="pace"><option value="1">Resting blob</option><option value="18">Swimming</option><option value="90">Fleeing</option></select></label><output id="status"></output><output id="check"></output></header>
<canvas id="canvas"></canvas><footer><a href="./?seed=umbra&fauna=1">Return to the living world ↗</a></footer>
<nav style="position:absolute;bottom:55px;left:32px;z-index:2"><a href="./pebble-study.html">Pebble hopper encounter study ↗</a><a href="./bird-study.html">Bird · ground to branch ↗</a><a href="./bird-sprites.html">Distant bird silhouettes ↗</a></nav>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FaunaMeshes } from './js/world/fauna/FaunaMeshes.js';
import { FaunaModel, SPECIES } from './js/world/fauna/FaunaModel.js';
import { damp } from './js/world/fauna/Locomotion.js';
import { createFogUniforms } from './js/world/FogGlsl.js';
import { checkFaunaShaders } from './tests/FaunaShaderChecks.js';
const renderer = new THREE.WebGLRenderer({canvas:document.querySelector('#canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color('#100b1c');
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,200);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.42,0.45,0.78));composer.addPass(new OutputPass());
const shared={moon:{dir:new THREE.Vector3(-.3,1,.4).normalize(),intensity:2.5},sun:{intensity:0},fogUniforms:createFogUniforms()};
shared.fogUniforms.uFogDensity.value=0;
const meshes=new FaunaMeshes(scene,shared);let model,subject,kind='lumen',paused=false,slow=false,elapsed=0;
const buttons={};
function select(k){
	kind=k;document.querySelector('#pace-control').hidden=k!=='lumen';const sample=()=>({ground:0,water:3,slope:0,wet:1,forest:1,foam:0});
	model=new FaunaModel('motion-study',{sample});subject=model.addGroup(k,k,0,0,1).members[0];
	subject.size=1;subject.speed=k==='lumen'?1:subject.speed;subject.pos={x:0,y:0,z:0};subject.prev={...subject.pos};subject.yaw=subject.prevYaw=0;subject.bank=subject.prevBank=0;subject.pitch=subject.prevPitch=0;subject.born=-10;
	model.creatures=[subject];model.time=10;model.listener={x:0,y:0,z:0};
	for(const [name,b] of Object.entries(buttons))b.setAttribute('aria-pressed',String(name===k));setView();
}
for(const k of ['lumen']){const b=document.createElement('button');b.textContent=SPECIES[k].name;b.onclick=()=>select(k);document.querySelector('#species').append(b);buttons[k]=b;}
function setView(){const dist=15;const view=document.querySelector('#view').value;const dirs={quarter:[.65,.5,1],side:[0,.12,1],top:[0,1,.001],front:[1,.1,0]};camera.position.fromArray(dirs[view]).normalize().multiplyScalar(dist);camera.lookAt(0,0,0);camera.setViewOffset(innerWidth,innerHeight,-Math.min(170,innerWidth*.18),-30,innerWidth,innerHeight);}
document.querySelector('#view').onchange=setView;
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};
document.querySelector('#slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));};
document.querySelector('#wire').onchange=e=>{for(const m of Object.values(meshes.meshes))m.material.wireframe=e.target.checked;};
function resize(){renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();setView();}addEventListener('resize',resize);
select(kind);resize();let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05)*(slow?.25:1);last=now;if(paused)dt=0;elapsed+=dt;model.time+=dt;subject.prevStroke=subject.stroke;if(kind==='lumen'){subject.speed=damp(subject.speed,Number(document.querySelector('#pace').value),3,dt);subject.effort=damp(subject.effort,Math.min(1,subject.speed/26),3,dt);subject.stroke+=dt*Math.PI*2*(.2+subject.effort*1.3);subject.breath+=dt;subject.vel={x:Math.cos(elapsed*.6)*subject.speed,y:Math.sin(elapsed*.43)*subject.speed*.35,z:Math.sin(elapsed*.6)*subject.speed};subject.oldVX=subject.vel.x;subject.oldVY=subject.vel.y;subject.oldVZ=subject.vel.z;subject.elastic={x:Math.sin(elapsed*.8)*.6,y:Math.cos(elapsed)*.4,z:Math.cos(elapsed*.8)*.6};}subject.prevStroke=subject.stroke;subject.bend=Math.sin(elapsed*.22)*.24;meshes.update(model,1,dt,()=>({ground:0}));composer.render();document.querySelector('#status').textContent=kind==='lumen'?(subject.speed<3?'Resting · rounded, breathing light':subject.speed>25?'Fast flight · rounded volume deforms with velocity':'Drifting · soft movement through the volume'):(subject.effort>.4?'Active stroke · flexible body':'Gliding · motion settles gradually');}
requestAnimationFrame(frame);
try{const reports=checkFaunaShaders();document.querySelector('#check').textContent='Vertex deformation verified for the lumen volume';document.body.dataset.shaderChecks=JSON.stringify(reports);document.body.dataset.status='pass';}catch(e){document.querySelector('#check').textContent=e.message;document.body.dataset.status='fail';console.error(e);}
</script>
</html>
